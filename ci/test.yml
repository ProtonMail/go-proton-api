---
govulncheck:
  stage: check
  extends:
    - .image-linux-test
    - .rules-MR-and-master-always
  timeout: 10m
  script:
    - ./ci/govulncheck.sh
  artifacts:
    when: always
    paths:
      - vulns*
  tags:
    - shared-medium

test-linux:
  stage: test
  extends:
    - .image-linux-test
    - .rules-MR-and-master-always
  timeout: 20m
  script:
    - go test -v ./...
    - go test -v -race ./...
  tags:
    - shared-large
