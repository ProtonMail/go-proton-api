---
govulncheck:
  stage: check
  extends:
    - .image-linux-test
    - .rules-MR-and-master-always
  timeout: 10m
  script:
    - ./ci/govulncheck.sh
  artifacts:
    when: always
    paths:
      - vulns*
  tags:
    - shared-medium

test-linux:
  stage: test
  extends:
    - .image-linux-test
    - .rules-MR-and-master-always
  timeout: 30m
  script:
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - bash utils/install_gotestsum.sh
    - bash ci/test.sh linux
    - bash ci/test_race.sh linux
  artifacts:
    when: always
    paths:
      - test-linux*.xml
    reports:
      junit: test-linux*.xml
  tags:
    - shared-large
