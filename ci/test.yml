---
govulncheck:
  stage: check
  extends:
    - .image-linux-test
    - .rules-MR-and-master-always
  timeout: 10m
  script:
    - ./ci/govulncheck.sh
  artifacts:
    when: always
    paths:
      - vulns*
  tags:
    - shared-medium

test-linux:
  stage: test
  extends:
    - .image-linux-test
    - .rules-MR-and-master-always
  timeout: 30m
  script:
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - bash utils/install_gotestsum.sh
    - gotestsum --junitfile test-linux.xml --format testname -- -timeout 15m ./...
    - gotestsum --junitfile test-linux-race.xml --format testname -- -race -timeout 15m ./...
  artifacts:
    when: always
    paths:
      - test-linux*.xml
    reports:
      junit: test-linux*.xml
  tags:
    - shared-large
